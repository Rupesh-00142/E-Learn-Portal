<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Learn - E-Learn</title>
<link rel="stylesheet" href="style.css">
<style>
  .learn-layout{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:0;
    min-height:70vh;
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    margin:32px 0;
  }
  .module-sidebar{
    background:var(--bg-light);
    border-right:1px solid var(--border);
    padding:20px 0;
    overflow-y:auto;
  }
  .module-sidebar h4{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--text-light);
    padding:0 20px 12px;
  }
  .module-nav-item{
    display:block;
    width:100%;
    text-align:left;
    padding:12px 20px;
    background:none;
    border:none;
    border-left:3px solid transparent;
    cursor:pointer;
    font-size:14px;
    color:var(--text);
    font-family:inherit;
  }
  .module-nav-item:hover{background:#EFEFEF;}
  .module-nav-item.active{
    border-left-color:var(--primary);
    background:#EAF1FF;
    color:var(--primary);
    font-weight:600;
  }
  .module-nav-item .num{
    display:inline-block;
    width:20px;
    color:var(--text-light);
    font-size:12px;
  }
  .lesson-pane{padding:32px 36px;}
  .lesson-pane h2{font-size:22px; margin-bottom:16px;}
  .lesson-content{
    font-size:15px;
    line-height:1.7;
    color:var(--text);
    white-space:pre-wrap;
    margin-bottom:24px;
  }
  .lesson-resource{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:12px 18px;
    background:var(--bg-light);
    border:1px solid var(--border);
    border-radius:var(--radius);
    font-size:14px;
    font-weight:600;
    color:var(--primary);
  }
  @media (max-width: 800px){
    .learn-layout{grid-template-columns:1fr;}
    .module-sidebar{border-right:none; border-bottom:1px solid var(--border);}
  }
</style>
</head>
<body>

<header>
  <nav class="navbar">
    <a href="index.html" class="logo">E-Learn</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-menu" id="navMenu">
      <li><a href="index.html">Home</a></li>
      <li><a href="courses.html">Courses</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions" id="navActions">
      <a href="login.html" class="btn btn-outline">Log in</a>
      <a href="signup.html" class="btn btn-primary">Registration</a>
    </div>
  </nav>
</header>

<main>
  <div class="container">

    <div id="learnLoading" style="padding:64px 0; text-align:center;">
      <p style="color:var(--text-light);">Loading course content...</p>
    </div>

    <div id="learnBlocked" style="padding:64px 0; text-align:center; display:none;">
      <h1 style="font-size:26px; margin-bottom:12px;" id="blockedTitle">You need to enroll first</h1>
      <p style="margin-bottom:24px;" id="blockedText">Enroll in this course to unlock its lessons.</p>
      <a href="courses.html" class="btn btn-primary" id="blockedLink">Courses</a>
    </div>

    <div id="learnContent" style="display:none;">
      <div style="padding-top:32px;">
        <p class="breadcrumb"><a href="index.html">Home</a> / <a href="courses.html">Courses</a> / <span id="crumbTitle"></span></p>
        <h1 id="courseTitle" style="font-size:28px;"></h1>
      </div>

      <div class="learn-layout">
        <div class="module-sidebar">
          <h4>Modules</h4>
          <div id="moduleNav"></div>
        </div>
        <div class="lesson-pane" id="lessonPane"></div>
      </div>
    </div>

  </div>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom" style="border-top:1px solid #1F2937; padding-top:22px;">
      <span>&copy; 2026 E-Learn. All rights reserved.</span>
      <span><a href="privacy.html">Privacy Policy</a> &middot; <a href="Terms.html">Terms</a> &middot; <a href="sitemap.html">Sitemap</a></span>
    </div>
  </div>
</footer>

<script src="Script.js"></script>
</body>
</html>
